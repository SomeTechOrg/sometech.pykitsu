[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "sometech.pykitsu"
dynamic = ["version"]
description = 'Modern Python Client for Kitsu Production Tracker'
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
keywords = []
authors = [{ name = "Dee", email = "dee.sometech@gmail.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typing_extensions>=4.6",
]

[dependency-groups]
dev = [
    "pyright>=1.1.380",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.urls]
Documentation = "https://github.com/SomeTechOrg/sometech.pykitsu#readme"
Issues = "https://github.com/SomeTechOrg/sometech.pykitsu/issues"
Source = "https://github.com/SomeTechOrg/sometech.pykitsu"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "./src/sometech/pykitsu/_version.py"

[tool.hatch.build]
# this is needed bc it is otherwise not included in the build:
artifacts = ['_version.py']
packages = ["src/sometech"]

[tool.hatch.build.targets.wheel]
# this is needed bc it is otherwise not included in the build:
artifacts = ['_version.py']
packages = ["src/sometech"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["E501", "RUF022"]

[tool.ruff.lint.per-file-ignores]
# Generated code spells unions Optional[...]/Union[...]: pydantic evaluates them at runtime on 3.9.
"src/sometech/pykitsu/groups/**" = ["E501", "RUF001", "RUF002", "B006", "UP007", "UP045"]
"src/sometech/pykitsu/models/_core.py" = ["RUF001", "RUF002", "UP007", "UP045"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.9"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
